<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Courier New",monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0;overscroll-behavior:none;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:1px;padding:4px 2px;box-sizing:border-box}
#hud b{color:#ffdd00}
#lives{color:#ffdd00;font-size:16px}
#timer{color:#fff;font-weight:bold}
#timer.low{color:#ff4a4a}
#stage{position:relative}
canvas{display:block}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:bold;color:#ffdd00;text-shadow:0 0 8px #000,0 0 4px #000;pointer-events:none;white-space:pre-line}
#msg .count{display:block;font-size:3.2em;animation:pop .9s ease-out}
#msg .round{direction:rtl;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:.3em;animation:rise .35s ease-out}
#msg .round .pill{display:flex;align-items:center;gap:.5em;font-size:.55em;color:#fff;background:rgba(0,0,24,.85);border:2px solid #ffdd00;border-radius:999px;padding:.25em .95em}
#msg .round .pill b{color:#ffdd00}
#msg .round .pill i{font-style:normal;letter-spacing:.15em;color:#ffdd00;font-size:.85em}
#msg .round .lvl{font-size:.45em;font-weight:normal;color:#fff;background:rgba(0,0,24,.7);border-radius:8px;padding:.15em .6em}
#msg .round .hint{max-width:15em;font-size:.48em;color:#111;background:#ffdd00;border-radius:10px;padding:.3em .8em;box-shadow:0 0 14px rgba(255,221,0,.6);animation:nudge .8s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes nudge{from{transform:scale(1)}to{transform:scale(1.06)}}
#msg .go{color:#7dff6b}
@keyframes pop{from{transform:scale(1.9);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:1}}
#hud{min-height:48px}
#hudR{display:flex;align-items:center;gap:8px}
#pauseBtn{display:none;width:40px;height:40px;touch-action:none;padding:0;border-radius:10px;border:2px solid #2a3cff;background:#0a0a2a;color:#fff;font-size:24px;font-weight:bold;line-height:1}
body.ingame #pauseBtn{display:block}
#pauseMenu{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.78);direction:rtl;font-family:system-ui,sans-serif}
#pauseMenu[hidden]{display:none}
#pauseMenu h2{margin:0 0 6px;color:#ffdd00;font-size:26px}
#pauseMenu button{min-width:190px;padding:12px 24px;border-radius:12px;border:2px solid #2a3cff;background:#2a3cff;color:#fff;font-size:18px;font-weight:bold}
#pauseMenu button.secondary{background:#0a0a2a}
#pauseMenu .note{font-size:12px;color:#bbb}
#msg small{display:block;margin-top:10px;font-size:13px;color:#fff;font-weight:normal}
#joy{display:none;position:relative;width:136px;height:136px;margin:10px 0;border-radius:50%;border:2px solid #2a3cff;background:radial-gradient(circle,#0a0a2a 55%,#13145a);touch-action:none}
#joy .hint{position:absolute;color:#2a3cff;font-size:14px;line-height:1;pointer-events:none}
#joy .u{top:8px;left:50%;transform:translateX(-50%)}#joy .d{bottom:8px;left:50%;transform:translateX(-50%)}
#joy .l{left:9px;top:50%;transform:translateY(-50%)}#joy .r{right:9px;top:50%;transform:translateY(-50%)}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b7bff,#2a3cff);box-shadow:0 0 14px #2a3cff;transition:transform .12s;pointer-events:none}
#joy.active #knob{transition:none}
@media (pointer:coarse){#joy{display:block}}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.82);direction:rtl;overflow-y:auto;padding:12px;box-sizing:border-box;font-family:system-ui,sans-serif}
#panel[hidden]{display:none}
#panel h1{margin:0;color:#ffdd00;font-size:34px;letter-spacing:2px}
#panel .final{font-size:18px}
#panel .final b{color:#ffdd00}
#panel form{display:flex;gap:6px}
#panel input{width:150px;padding:8px;border-radius:8px;border:2px solid #2a3cff;background:#0a0a2a;color:#fff;font-size:16px;text-align:center;user-select:text;-webkit-user-select:text}
#panel button{padding:10px 26px;border-radius:10px;border:2px solid #2a3cff;background:#2a3cff;color:#fff;font-size:17px;font-weight:bold}
#panel form button{padding:8px 14px;font-size:15px}
#board{width:min(270px,92%);font-size:15px;max-height:45%;overflow-y:auto}
#board .del{background:none;border:none;padding:0 4px;font-size:15px}
#panel .nameform{flex-direction:column;align-items:center}
#panel .row{display:flex;gap:6px}

#panel .who{font-size:14px;color:#ccc}
#panel .admin{font-size:13px;color:#2de0ff;display:flex;align-items:center;gap:6px}
#panel input[type=email],#panel input[type=password]{width:210px}
#panel button.link{background:none;border:none;color:#2de0ff;padding:2px 6px;font-size:14px;font-weight:normal;text-decoration:underline}
#panel button:disabled{opacity:.4}
#panel .menu{position:absolute;top:8px;right:8px;z-index:2}
#panel .burger{padding:4px 12px;font-size:22px;line-height:1;background:#0a0a2a}
#panel .menu-list{position:absolute;top:46px;right:0;background:#0a0a2a;border:2px solid #2a3cff;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:180px}
#panel .menu-list[hidden]{display:none}
#panel .menu-list button{background:none;border:none;text-align:right;font-size:15px;padding:8px 10px;font-weight:normal;white-space:nowrap}
#panel .menu-list button:active{background:#2a3cff}
#panel .row{flex-wrap:wrap;justify-content:center}
#panel #nameIn{width:140px}
#panel #pinIn{width:120px;letter-spacing:4px}

#panel .levels{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:320px}
#panel .lvl{width:56px;height:60px;padding:4px 0;border-radius:12px;border:2px solid var(--c);background:#0a0a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-weight:normal}
#panel .lvl b{font-size:22px;color:var(--c)}
#panel .lvl span{font-size:11px}
#panel .lvl i{position:absolute;top:-9px;left:-6px;font-style:normal;font-size:15px}
#panel .lvl:disabled{opacity:.35}

#panel button.secondary{background:#0a0a2a}
#panel .logo{font-size:46px;text-shadow:0 0 18px rgba(255,221,0,.45)}

#panel .play span{font-size:13px;font-weight:normal}
#panel .progress{font-size:13px;color:#ccc}

#panel .side.open{transform:none}
#panel .side #board{width:100%;max-height:none}
#panel .side .close{position:absolute;top:8px;right:8px;padding:2px 10px;background:none;border:none;font-size:20px}
#panel.with-side{padding-left:282px}
#panel .plist{width:min(300px,94%);max-height:62%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:14px}
#panel .prow{background:rgba(42,60,255,.15);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}

#panel .pname{font-weight:bold;unicode-bidi:plaintext;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel .pdel{background:none;border:none;padding:2px 4px;font-size:16px}
#panel .pscore{background:none;border:none;padding:2px 4px;font-size:14px;font-weight:normal;color:#ffdd00}

let score = 0, hi = +safeGet('chomper-hi') || 0, lives = 3;
let levelIdx = 0, LV = LEVELS[0], MAP = LV.map;
let state = 'title', stateT = 0, modeT = 0, frightT = 0, combo = 0, timeLeft = 0, shownTime = -1, timedOut = false, phase = -1;

// ---------- map helpers ----------
const tileAt = (x, y) => (y < 0 || y >= H) ? '#' : MAP[y][((x % W) + W) % W];
function passable(x, y, e) {
  const t = tileAt(x, y);
  if (t === '#') return false;
  if (t === '-') return !!e.ghost && (e.inHouse || e.eyes);
  return true;
}
function bfs(sx, sy) {
  const d = Array.from({length: H}, () => Array(W).fill(Infinity));
  const q = [[sx, sy]]; d[sy][sx] = 0;
  while (q.length) {
    const [x, y] = q.shift();
    for (const dir of [U, D, L, R]) {
      const nx = (x + dir.x + W) % W, ny = y + dir.y;
      if (ny < 0 || ny >= H || MAP[ny][nx] === '#') continue;
      if (d[ny][nx] > d[y][x] + 1) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return d;
}
let eyeDist = bfs(9, 9);
function loadLevel(i) {
  levelIdx = i; LV = LEVELS[i]; MAP = LV.map;
  eyeDist = bfs(9, 9);
  fit();
}
const progress = () => +safeGet('pac-progress') || 0;  // number of levels cleared

// ---------- movement ----------
const isInt = v => Math.abs(v - Math.round(v)) < 1e-6;
function step(e, dt, choose) {
  let rem = e.speed * dt;
  while (rem > 1e-9) {
    if (isInt(e.x) && isInt(e.y)) {
      e.x = Math.round(e.x); e.y = Math.round(e.y);
      choose(e);
      if (!e.dir) break;
    }
    let d;
    if (e.dir.x !== 0) {
      const target = e.dir.x > 0 ? Math.floor(e.x + 1e-6) + 1 : Math.ceil(e.x - 1e-6) - 1;
      d = Math.abs(target - e.x);
    } else {
      const target = e.dir.y > 0 ? Math.floor(e.y + 1e-6) + 1 : Math.ceil(e.y - 1e-6) - 1;
      d = Math.abs(target - e.y);
    }
    const m = Math.min(rem, d);
    e.x += e.dir.x * m; e.y += e.dir.y * m; rem -= m;
    if (e.x <= -1) e.x += W; else if (e.x >= W) e.x -= W;
  }
}

// ---------- actors ----------
function mkGhost(name, color, x, y, wait, corner) {
  return {ghost: true, name, color, x, y, dir: wait ? null : L, speed: 6, inHouse: wait > 0,
          eyes: false, fright: false, wait, corner, reverse: false};
}
function resetActors() {
  pac = {x: 9, y: 15, dir: null, want: null, face: R, speed: LV.pac, anim: 0};
  const w = LV.chase ? 0.5 : 1;
  ghosts = [
    mkGhost('blinky', '#ff2d2d', 9, 7, 0,   {x: 17, y: 0}),
    mkGhost('pinky',  '#ff8de0', 9, 9, 1.5 * w, {x: 1,  y: 0}),
    mkGhost('inky',   '#2de0ff', 8, 9, 4 * w,   {x: 17, y: 20}),
    mkGhost('clyde',  '#ffa42d', 10, 9, 7 * w,  {x: 1,  y: 20})
  ];
  if (LV.ghosts > 4) ghosts.push(
    mkGhost('blinky', '#7dff6b', 9, 9, 9 * w,  {x: 9, y: 0}),
    mkGhost('pinky',  '#ffffff', 9, 9, 11 * w, {x: 9, y: 20}));
}

function updatePac(dt) {
  const p = pac;
  if (p.dir && p.want && p.want.x === -p.dir.x && p.want.y === -p.dir.y) p.dir = p.want;
  step(p, dt, e => {
    if (e.want && passable(e.x + e.want.x, e.y + e.want.y, e)) e.dir = e.want;
    else if (!(e.dir && passable(e.x + e.dir.x, e.y + e.dir.y, e))) e.dir = null;
  });
  if (p.dir) { p.face = p.dir; p.anim += dt * 16; }

  const tx = Math.round(p.x), ty = Math.round(p.y);
  const c = pellets[ty] && pellets[ty][tx];
  if (c === '.') {
    pellets[ty][tx] = ' '; pelletsLeft--; addScore(10 * LV.mult);
  } else if (c === 'o') {
    pellets[ty][tx] = ' '; pelletsLeft--; addScore(50 * LV.mult);
    frightT = LV.fright; combo = 0;
    for (const g of ghosts) if (!g.eyes) { g.fright = true; if (!g.inHouse) g.reverse = true; }
  }
}

function ghostTarget(g) {
  if (g.inHouse) return {x: 9, y: 7};
  if (!LV.chase && (modeT % 27) < 7) return g.corner;
  const px = Math.round(pac.x), py = Math.round(pac.y), f = pac.face;
  switch (g.name) {
    case 'blinky': return {x: px, y: py};
    case 'pinky':  return {x: px + 4 * f.x, y: py + 4 * f.y};
    case 'inky': {
      const b = ghosts[0], ax = px + 2 * f.x, ay = py + 2 * f.y;
      return {x: 2 * ax - b.x, y: 2 * ay - b.y};
    }
    default: {
      const dx = g.x - px, dy = g.y - py;
      return (dx * dx + dy * dy > 64) ? {x: px, y: py} : g.corner;
    }
  }
}
function ghostChoose(g) {
  const all = [U, L, D, R];
  if (g.eyes) {
    if (g.x === 9 && g.y === 9) {
      g.eyes = false; g.fright = false; g.inHouse = true; g.dir = null; g.wait = 0.4; return;
    }
    let best = null, bd = Infinity;
    for (const d of all) {
      if (!passable(g.x + d.x, g.y + d.y, g)) continue;
      const nx = ((g.x + d.x) % W + W) % W, ny = g.y + d.y;
      if (eyeDist[ny][nx] < bd) { bd = eyeDist[ny][nx]; best = d; }
    }
    g.dir = best; return;
  }
  if (g.inHouse && g.y <= 7) g.inHouse = false;
  if (g.reverse) {
    g.reverse = false;
    if (g.dir) {
      const r = {x: -g.dir.x, y: -g.dir.y};
      if (passable(g.x + r.x, g.y + r.y, g)) { g.dir = r; return; }
    }
  }
  let opts = all.filter(d => !(g.dir && d.x === -g.dir.x && d.y === -g.dir.y) && passable(g.x + d.x, g.y + d.y, g));
  if (!opts.length) opts = all.filter(d => passable(g.x + d.x, g.y + d.y, g));
  if (!opts.length) { g.dir = null; return; }
  if (g.fright && !g.inHouse) { g.dir = opts[Math.floor(Math.random() * opts.length)]; return; }
  const t = ghostTarget(g);
  let best = opts[0], bd = Infinity;
  for (const d of opts) {
    const dx = g.x + d.x - t.x, dy = g.y + d.y - t.y, dd = dx * dx + dy * dy;
    if (dd < bd) { bd = dd; best = d; }
  }
  g.dir = best;
}
function updateGhost(g, dt) {
  if (g.wait > 0) { g.wait -= dt; return; }
  g.speed = g.eyes ? 14 : g.fright ? 4 : LV.ghost;
  step(g, dt, ghostChoose);
}

// ---------- game flow ----------
function addScore(n) {
  score += n;
  if (score > hi) { hi = score; }
  updateHud();
}
function updateHud() {
  $('score').textContent = score;
  $('hi').textContent = hi;
  $('lives').textContent = '●'.repeat(Math.max(0, lives));
  const tm = $('timer');
  tm.textContent = LV.time && state !== 'title' ? '⏱ ' + Math.max(0, Math.ceil(timeLeft)) : '';
  tm.classList.toggle('low', LV.time > 0 && timeLeft < 10);
}
function setState(s) {
  state = s; stateT = 0;
  document.body.classList.toggle('ingame', s === 'ready' || s === 'play' || s === 'dying' || s === 'win');
  setPaused(false);
  const m = $('msg');
  phase = 0;
  m.innerHTML = {ready: roundTitle(), play: '<span class="count go">צא!</span>', win: 'LEVEL CLEAR!'}[s] || '';
  if (s === 'over' || s === 'cleared') safeSet('chomper-hi', hi);
  const panel = s === 'title' || s === 'over' || s === 'cleared';
  $('panel').hidden = !panel;
  if (panel) showPanel(s);
  updateHud();
}
const roundTitle = () => `<div class="round"><div class="pill">סיבוב <b>${4 - lives}</b> מתוך 3 <i>${'●'.repeat(4 - lives)}${'○'.repeat(lives - 1)}</i></div>` +
  `<div class="lvl">${LV.icon} שלב ${levelIdx + 1} · ${LV.name}</div>${LV.hint ? `<div class="hint">💡 ${LV.hint}</div>` : ''}</div>`;
const ROUND_CARD = 1.6, COUNT_STEP = 1;  // seconds the round intro shows, then each of 3-2-1
function newLevel() {
  pellets = MAP.map(r => [...r].map(c => (c === '.' || c === 'o') ? c : ' '));
  pelletsLeft = pellets.flat().filter(c => c !== ' ').length;
  resetActors(); modeT = 0; frightT = 0;
  timeLeft = LV.time || 0; shownTime = -1;
  setState('ready');
}
function newGame(i) {
  if (LB_ON && !playerName) return;
  score = 0; lives = 3; timedOut = false;
  loadLevel(i); newLevel(); updateHud();
}
function startIfNeeded() {
  if (state === 'title') newGame(Math.min(progress(), LEVELS.length - 1));
  else if (state === 'over') newGame(levelIdx);
  else if (state === 'cleared' && levelIdx < LEVELS.length - 1) newGame(levelIdx + 1);
}

// The ⋮ button pauses the game; from there the player continues or leaves for the lobby
// (the attempt is dropped and its score is not sent).
let paused = false;
function setPaused(on) {
  paused = on && document.body.classList.contains('ingame');
  $('pauseMenu').hidden = !paused;
}
function update(dt) {
  if (paused) return;
  stateT += dt;
  if (state === 'ready') {
    if (stateT >= ROUND_CARD + 3 * COUNT_STEP) { setState('play'); return; }
    const n = stateT < ROUND_CARD ? 0 : 1 + Math.floor((stateT - ROUND_CARD) / COUNT_STEP);  // 0: round card, then 3, 2, 1
    if (n !== phase) { phase = n; $('msg').innerHTML = n ? `<span class="count">${4 - n}</span>` : roundTitle(); }
    return;
  }
  if (state === 'dying') {
    if (stateT > 1.4) {
      lives--; updateHud(); safeSet('chomper-hi', hi);
      if (lives <= 0) setState('over'); else { resetActors(); frightT = 0; setState('ready'); }
    }
    return;
  }
  if (state === 'win') {
    if (stateT > 1.5) {
      if (progress() < levelIdx + 1) saveProgress(levelIdx + 1);
      setState('cleared');
    }
    return;
  }
  if (state !== 'play') return;

  if (phase === 0 && stateT > 0.7) { phase = 1; $('msg').innerHTML = ''; }
  modeT += dt;
  if (LV.time) {
    timeLeft -= dt;
    if (Math.ceil(timeLeft) !== shownTime) { shownTime = Math.ceil(timeLeft); updateHud(); }
    if (timeLeft <= 0) { timedOut = true; lives = 1; setState('dying'); return; }
  }
  if (frightT > 0) {
    frightT -= dt;
    if (frightT <= 0) for (const g of ghosts) g.fright = false;
  }
  updatePac(dt);
  for (const g of ghosts) updateGhost(g, dt);

  if (pelletsLeft <= 0) { setState('win'); return; }
  for (const g of ghosts) {
    if (g.eyes) continue;
    const dx = g.x - pac.x, dy = g.y - pac.y;
    if (dx * dx + dy * dy < 0.45) {
      if (g.fright) {
        g.eyes = true; g.fright = false;
        addScore(200 * LV.mult * Math.pow(2, Math.min(combo++, 3)));
      } else {
        setState('dying');
        try { navigator.vibrate && navigator.vibrate(150); } catch (e) {}
        return;
      }
    }
  }
}

// ---------- leaderboard (Firebase Realtime Database + Auth over REST) ----------
const LB = {
  db: 'https://packman-2cb6c-default-rtdb.europe-west1.firebasedatabase.app',
  apiKey: 'AIzaSyDW5Y8BNw42K2bDutOkbvSGeXF2qcB9eBA',
  authBase: 'https://identitytoolkit.googleapis.com',
  tokenBase: 'https://securetoken.googleapis.com',
  ns: ''  // only used with the local Firebase emulator
};
const LB_ON = !!(LB.db && LB.apiKey);
const NAME_RE = /^[\p{L}\p{N} _-]{2,12}$/u, PIN_RE = /^\d{4}$/;
const PLAYER = 'pac-auth', ADMIN = 'pac-admin';
let playerName = safeGet('pac-name') || '';
let secured = safeGet('pac-secured') === '1';  // the account has a name + code login, so it survives a reinstall
let acctMode = 'new';
// A name saved by an older version was never registered on the server: offer it again.
const legacyName = LB_ON && !safeGet(PLAYER) ? playerName : '';
if (legacyName) playerName = '';

// Sessions: players sign in with their name and a 4-digit code (older players started out anonymous), the admin with email and password.
function loadSession(key) { try { return JSON.parse(safeGet(key) || 'null'); } catch (e) { return null; } }
function saveSession(key, uid, idToken, refreshToken, expiresIn) {
  const s = {uid, idToken, refreshToken, exp: Date.now() + (expiresIn - 60) * 1000};
  safeSet(key, JSON.stringify(s));
  return s;
}
async function postJson(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || 'HTTP ' + r.status);
  return j;
}
async function session(key) {
  let s = loadSession(key);
  if (!s && key === PLAYER) {
    const j = await postJson(`${LB.authBase}/v1/accounts:signUp?key=${LB.apiKey}`, {returnSecureToken: true});
    s = saveSession(key, j.localId, j.idToken, j.refreshToken, +j.expiresIn);
  }
  if (s && Date.now() > s.exp) {
    const r = await fetch(`${LB.tokenBase}/v1/token?key=${LB.apiKey}`, {
      method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.refreshToken)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 400) safeSet(key, '');  // account deleted or revoked
      throw new Error('refresh failed');
    }
    s = saveSession(key, j.user_id, j.id_token, j.refresh_token, +j.expires_in);
  }
  return s;
}
async function db(method, path, body, s, params = {}) {
  const q = new URLSearchParams(params);
  if (s) q.set('auth', s.idToken);
  if (LB.ns) q.set('ns', LB.ns);
  const r = await fetch(`${LB.db}/${path}.json?${q}`, body === undefined ? {method}
    : {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), {status: r.status});
  return r.json();
}

// A player's login is an email/password account derived from their name and code, so the same
// account (name, scores, progress) comes back on a new phone or after reinstalling.
async function playerEmail(name) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(name.toLowerCase()));
  return 'p' + [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 40) + '@players.dpackman.app';
}
const playerPass = pin => 'dp-' + pin;
const authUrl = op => `${LB.authBase}/v1/accounts:${op}?key=${LB.apiKey}`;
function setPlayer(name, isSecured) {
  playerName = name; safeSet('pac-name', name);
  secured = isSecured; safeSet('pac-secured', isSecured ? '1' : '');
}
function authError(e) {
  const m = e.message || '';
  if (/EMAIL_EXISTS/.test(m)) return new Error('taken');
  if (/TOO_MANY/.test(m)) return new Error('many');
  if (/INVALID|EMAIL_NOT_FOUND|PASSWORD|USER_DISABLED/.test(m)) return new Error('wrong');
  return e;
}
// Names are unique and permanent: players/{uid}/name and names/{lowercase name} are written together, once.
async function claimName(s, name) {
  const key = name.toLowerCase();
  const owner = await db('GET', 'names/' + encodeURIComponent(key));
  if (owner && owner !== s.uid) throw new Error('taken');
  try {
    await db('PATCH', '', {[`players/${s.uid}/name`]: name, [`players/${s.uid}/secured`]: true, [`names/${key}`]: s.uid}, s);
  } catch (e) {
    if (e.status === 401 || e.status === 403) throw new Error('taken');
    throw e;
  }
  await takeReleased(s, name);
}
// A player the admin moved to a new device: their score and cleared levels wait under released/{name}.
async function takeReleased(s, name) {
  const path = 'released/' + encodeURIComponent(name.toLowerCase()), r = await db('GET', path);
  if (!r) return;
  if (r.score > 0) await db('PUT', `scores/${s.uid}`, {name, score: r.score}, s).catch(() => {});
  if (r.progress > progress()) safeSet('pac-progress', r.progress);
  await db('DELETE', path, undefined, s).catch(() => {});
}
async function registerName(name, pin) {
  let s = loadSession(PLAYER) && await session(PLAYER);
  const mine = s && await db('GET', `players/${s.uid}/name`);
  if (mine) { setPlayer(mine, false); return securePlayer(pin); }
  const owner = await db('GET', 'names/' + encodeURIComponent(name.toLowerCase()));
  if (owner && (!s || owner !== s.uid)) throw new Error('taken');
  // An anonymous session left by an older version is upgraded in place; otherwise a new account is created.
  const email = await playerEmail(name), password = playerPass(pin);
  const j = await postJson(authUrl(s ? 'update' : 'signUp'), s ? {idToken: s.idToken, email, password, returnSecureToken: true}
    : {email, password, returnSecureToken: true}).catch(e => { throw authError(e); });
  s = saveSession(PLAYER, j.localId, j.idToken, j.refreshToken, +j.expiresIn);
  await claimName(s, name);
  setPlayer(name, true);
  await pullProgress(s);
}
async function securePlayer(pin) {
  const s = await session(PLAYER);
  const j = await postJson(authUrl('update'), {idToken: s.idToken, email: await playerEmail(playerName),
    password: playerPass(pin), returnSecureToken: true}).catch(e => { throw authError(e); });
  const s2 = saveSession(PLAYER, j.localId, j.idToken, j.refreshToken, +j.expiresIn);
  await db('PUT', `players/${s2.uid}/secured`, true, s2);
  setPlayer(playerName, true);
}
async function loginPlayer(name, pin) {
  const j = await postJson(authUrl('signInWithPassword'), {email: await playerEmail(name), password: playerPass(pin),
    returnSecureToken: true}).catch(e => { throw authError(e); });
  const s = saveSession(PLAYER, j.localId, j.idToken, j.refreshToken, +j.expiresIn);
  let mine = await db('GET', `players/${s.uid}/name`);
  if (!mine) { await claimName(s, name); mine = name; }  // the admin removed this player: take the name back
  setPlayer(mine, true);
  await pullProgress(s);
}
// Cleared levels are kept on the server too, so they come back with the account.
// 'pac-progress-seen' is the server value this device last synced; when the server holds something
// else, it changed elsewhere (another phone, or the admin) and wins over the device.
function saveProgress(n) {
  safeSet('pac-progress', n);
  if (LB_ON && playerName && loadSession(PLAYER))
    session(PLAYER).then(s => db('PUT', `players/${s.uid}/progress`, n, s))
      .then(() => safeSet('pac-progress-seen', n)).catch(() => {});
}
async function pullProgress(s) {
  const server = +(await db('GET', `players/${s.uid}/progress`)) || 0, seen = safeGet('pac-progress-seen');
  if ((seen !== null && seen !== '' && +seen !== server) || server > progress()) safeSet('pac-progress', server);
  let synced = server;
  if (progress() > server) {
    try { await db('PUT', `players/${s.uid}/progress`, progress(), s); synced = progress(); } catch (e) {}
  }
  safeSet('pac-progress-seen', synced);
}
function syncName() {
  if (!LB_ON || !loadSession(PLAYER)) return;
  const before = playerName + '/' + progress();
  const refresh = () => { if (before !== playerName + '/' + progress() && (state === 'title' || state === 'over')) showPanel(state); };
  session(PLAYER).then(async s => {
    const name = (await db('GET', `players/${s.uid}/name`)) || '';
    if (name !== playerName) { playerName = name; safeSet('pac-name', name); }
    if (name) await pullProgress(s);
    refresh();
  }).catch(() => { if (!loadSession(PLAYER)) { setPlayer('', false); refresh(); } });
}
async function submitScore() {
  if (!LB_ON || !playerName || score <= 0) return;
  const s = await session(PLAYER);
  const best = await db('GET', `scores/${s.uid}/score`);
  if (best >= score) return;
  await db('PUT', `scores/${s.uid}`, {name: playerName, score}, s);
}
async function fetchTop(limit) {
  const data = await db('GET', 'scores', undefined, null, {orderBy: '"score"', limitToLast: limit});
  return Object.entries(data || {})
    .map(([id, v]) => ({id, name: String(v.name), score: +v.score}))
    .sort((a, b) => b.score - a.score);
}
const isAdmin = () => !!loadSession(ADMIN);
async function adminLogin(email, password) {
  const j = await postJson(`${LB.authBase}/v1/accounts:signInWithPassword?key=${LB.apiKey}`,
    {email, password, returnSecureToken: true});
  saveSession(ADMIN, j.localId, j.idToken, j.refreshToken, +j.expiresIn);
}
// Moves an older player (no code yet) to a new device: keeps their score and levels under released/{name}
// and frees the name, so they get everything back when they register again with the same name.
async function adminRelease(row, done) {
  const s = await session(ADMIN), key = row.name.toLowerCase();
  const body = {[`released/${key}`]: {score: row.score, progress: done}, [`scores/${row.id}`]: null, [`players/${row.id}`]: null};
  if (await db('GET', 'names/' + encodeURIComponent(key)) === row.id) body[`names/${key}`] = null;
  await db('PATCH', '', body, s);
}
// Removes the player from the table and frees their name.
async function adminDelete(row) {
  const s = await session(ADMIN), key = row.name.toLowerCase();
  const body = {[`scores/${row.id}`]: null, [`players/${row.id}`]: null};
  if (await db('GET', 'names/' + encodeURIComponent(key)) === row.id) body[`names/${key}`] = null;
  await db('PATCH', '', body, s);
}

const el = (tag, props) => Object.assign(document.createElement(tag), props);
function loadBoard() {
  const b = $('board');
  if (!b) return;
  const admin = isAdmin(), me = (loadSession(PLAYER) || {}).uid;
  b.innerHTML = '<h2>🏆 טבלת שיאים</h2>';
  const body = b.appendChild(el('div', {className: 'muted', textContent: 'טוען...'}));
  Promise.all([fetchTop(admin ? 100 : 10), admin ? db('GET', 'players') : null]).then(([rows, players]) => {
    if (!rows.length) { body.textContent = 'עוד אין שיאים. תהיה הראשון!'; return; }

  if (d !== joyDir) { joyDir = d; setWant(d); try { navigator.vibrate && navigator.vibrate(8); } catch (err) {} }
}
joy.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joy.classList.add('active'); joyMove(e);
});
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => {
  if (e.pointerId !== joyId) return;
  joyId = null; joyDir = null; joy.classList.remove('active'); knob.style.transform = '';
};
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);
let sx = 0, sy = 0, down = false;
addEventListener('pointerdown', e => { down = true; sx = e.clientX; sy = e.clientY; });
addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  setWant(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? R : L) : (dy > 0 ? D : U));
  sx = e.clientX; sy = e.clientY;
});
addEventListener('pointerup', () => { down = false; });
addEventListener('pointercancel', () => { down = false; });
addEventListener('resize', fit);
addEventListener('orientationchange', fit);

// ---------- main loop ----------
let last = 0;
function frame(ts) {
  const t = ts / 1000, dt = Math.min(0.05, t - last || 0); last = t;
  update(dt); draw(t);
  requestAnimationFrame(frame);
}
resetActors();
updateHud(); fit(); setState('title'); syncName();
requestAnimationFrame(frame);
window.__chomper = {get state() { return state; }, get score() { return score; }, newGame, setWant, U, D, L, R};

if ('serviceWorker' in navigator) {
  if (window.Capacitor) {
    // Inside the Android app the files are local, so an offline cache only gets in the way of updates.
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  } else if (/^https?:$/.test(location.protocol)) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
}
})();
</script>
