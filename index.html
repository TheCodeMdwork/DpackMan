<script>
(() => {
'use strict';

// Five levels. Clearing one unlocks the next in the lobby; later levels are faster and worth more.
// dark: only the area around the player is visible. chase: ghosts never fall back to their corners.
const LEVELS = [
  {name: 'קלאסי', icon: '🟦', color: '#2a3cff', pac: 7.0, ghost: 6.0, fright: 7, mult: 1,
  map: [

  map: [

    "#....#.......#....#",
    "#.##.#.##.##.#.##.#",

    "####.  #   #  .####",

    "#.................#",
    "#.#.###.###.###.#.#",

  ]},
  {name: 'אש', icon: '🔥', color: '#ff4a2a', pac: 7.6, ghost: 7.2, fright: 4, mult: 4,
  map: [
    "###################",
    "#.................#",

    "###################"
  ]},
  {name: 'בוס', icon: '👑', color: '#ffc21a', pac: 7.8, ghost: 7.5, fright: 3, mult: 5, chase: true,
  map: [
    "###################",
    "#o...............o#",
    "#.#.###.###.###.#.#",

    "#o#.#....P....#.#o#",
    "#...#.#.###.#.#...#",
    "#.###.#..#..#.###.#",
    "#.....##.#.##.....#",
    "#.................#",
    "###################"
  ]}
];
const W = 19, H = 21;
const U = {x:0,y:-1}, D = {x:0,y:1}, L = {x:-1,y:0}, R = {x:1,y:0};

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const safeGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

let cell = 20, wallLayer = null;
let pellets, pelletsLeft = 0;
let pac, ghosts = [];
let score = 0, hi = +safeGet('chomper-hi') || 0, lives = 3;
let levelIdx = 0, LV = LEVELS[0], MAP = LV.map;
let state = 'title', stateT = 0, modeT = 0, frightT = 0, combo = 0;

// ---------- map helpers ----------
const tileAt = (x, y) => (y < 0 || y >= H) ? '#' : MAP[y][((x % W) + W) % W];
function passable(x, y, e) {
  const t = tileAt(x, y);
  if (t === '#') return false;
  if (t === '-') return !!e.ghost && (e.inHouse || e.eyes);
  return true;
}
function bfs(sx, sy) {
  const d = Array.from({length: H}, () => Array(W).fill(Infinity));
  const q = [[sx, sy]]; d[sy][sx] = 0;
  while (q.length) {
    const [x, y] = q.shift();
    for (const dir of [U, D, L, R]) {
      const nx = (x + dir.x + W) % W, ny = y + dir.y;
      if (ny < 0 || ny >= H || MAP[ny][nx] === '#') continue;
      if (d[ny][nx] > d[y][x] + 1) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return d;
}
let eyeDist = bfs(9, 9);
function loadLevel(i) {
  levelIdx = i; LV = LEVELS[i]; MAP = LV.map;
  eyeDist = bfs(9, 9);
  fit();
}
const progress = () => +safeGet('pac-progress') || 0;  // number of levels cleared

// ---------- movement ----------
const isInt = v => Math.abs(v - Math.round(v)) < 1e-6;
function step(e, dt, choose) {
  let rem = e.speed * dt;
  while (rem > 1e-9) {
    if (isInt(e.x) && isInt(e.y)) {
      e.x = Math.round(e.x); e.y = Math.round(e.y);
      choose(e);
      if (!e.dir) break;
    }
    let d;
    if (e.dir.x !== 0) {
      const target = e.dir.x > 0 ? Math.floor(e.x + 1e-6) + 1 : Math.ceil(e.x - 1e-6) - 1;
      d = Math.abs(target - e.x);
    } else {
      const target = e.dir.y > 0 ? Math.floor(e.y + 1e-6) + 1 : Math.ceil(e.y - 1e-6) - 1;
      d = Math.abs(target - e.y);
    }
    const m = Math.min(rem, d);
    e.x += e.dir.x * m; e.y += e.dir.y * m; rem -= m;
    if (e.x <= -1) e.x += W; else if (e.x >= W) e.x -= W;
  }
}

// ---------- actors ----------
function mkGhost(name, color, x, y, wait, corner) {
  return {ghost: true, name, color, x, y, dir: wait ? null : L, speed: 6, inHouse: wait > 0,
          eyes: false, fright: false, wait, corner, reverse: false};
}
function resetActors() {
  pac = {x: 9, y: 15, dir: null, want: null, face: R, speed: LV.pac, anim: 0};
  const w = LV.chase ? 0.5 : 1;
  ghosts = [
    mkGhost('blinky', '#ff2d2d', 9, 7, 0,   {x: 17, y: 0}),
    mkGhost('pinky',  '#ff8de0', 9, 9, 1.5 * w, {x: 1,  y: 0}),
    mkGhost('inky',   '#2de0ff', 8, 9, 4 * w,   {x: 17, y: 20}),
    mkGhost('clyde',  '#ffa42d', 10, 9, 7 * w,  {x: 1,  y: 20})
  ];
}

function updatePac(dt) {
  const p = pac;
  if (p.dir && p.want && p.want.x === -p.dir.x && p.want.y === -p.dir.y) p.dir = p.want;
  step(p, dt, e => {
    if (e.want && passable(e.x + e.want.x, e.y + e.want.y, e)) e.dir = e.want;
    else if (!(e.dir && passable(e.x + e.dir.x, e.y + e.dir.y, e))) e.dir = null;
  });
  if (p.dir) { p.face = p.dir; p.anim += dt * 16; }

  const tx = Math.round(p.x), ty = Math.round(p.y);
  const c = pellets[ty] && pellets[ty][tx];
  if (c === '.') {
    pellets[ty][tx] = ' '; pelletsLeft--; addScore(10 * LV.mult);
  } else if (c === 'o') {
    pellets[ty][tx] = ' '; pelletsLeft--; addScore(50 * LV.mult);
    frightT = LV.fright; combo = 0;
    for (const g of ghosts) if (!g.eyes) { g.fright = true; if (!g.inHouse) g.reverse = true; }
  }
}

function ghostTarget(g) {
  if (g.inHouse) return {x: 9, y: 7};
  if (!LV.chase && (modeT % 27) < 7) return g.corner;
  const px = Math.round(pac.x), py = Math.round(pac.y), f = pac.face;
  switch (g.name) {
    case 'blinky': return {x: px, y: py};
    case 'pinky':  return {x: px + 4 * f.x, y: py + 4 * f.y};
    case 'inky': {
      const b = ghosts[0], ax = px + 2 * f.x, ay = py + 2 * f.y;
      return {x: 2 * ax - b.x, y: 2 * ay - b.y};
    }
    default: {
      const dx = g.x - px, dy = g.y - py;
      return (dx * dx + dy * dy > 64) ? {x: px, y: py} : g.corner;
    }
  }
}
function ghostChoose(g) {
  const all = [U, L, D, R];
  if (g.eyes) {
    if (g.x === 9 && g.y === 9) {
      g.eyes = false; g.fright = false; g.inHouse = true; g.dir = null; g.wait = 0.4; return;
    }
    let best = null, bd = Infinity;
    for (const d of all) {
      if (!passable(g.x + d.x, g.y + d.y, g)) continue;
      const nx = ((g.x + d.x) % W + W) % W, ny = g.y + d.y;
      if (eyeDist[ny][nx] < bd) { bd = eyeDist[ny][nx]; best = d; }
    }
    g.dir = best; return;
  }
  if (g.inHouse && g.y <= 7) g.inHouse = false;
  if (g.reverse) {
    g.reverse = false;
    if (g.dir) {
      const r = {x: -g.dir.x, y: -g.dir.y};
      if (passable(g.x + r.x, g.y + r.y, g)) { g.dir = r; return; }
    }
  }
  let opts = all.filter(d => !(g.dir && d.x === -g.dir.x && d.y === -g.dir.y) && passable(g.x + d.x, g.y + d.y, g));
  if (!opts.length) opts = all.filter(d => passable(g.x + d.x, g.y + d.y, g));
  if (!opts.length) { g.dir = null; return; }
  if (g.fright && !g.inHouse) { g.dir = opts[Math.floor(Math.random() * opts.length)]; return; }
  const t = ghostTarget(g);
  let best = opts[0], bd = Infinity;
  for (const d of opts) {
    const dx = g.x + d.x - t.x, dy = g.y + d.y - t.y, dd = dx * dx + dy * dy;
    if (dd < bd) { bd = dd; best = d; }
  }
  g.dir = best;
}
function updateGhost(g, dt) {
  if (g.wait > 0) { g.wait -= dt; return; }
  g.speed = g.eyes ? 14 : g.fright ? 4 : LV.ghost;
  step(g, dt, ghostChoose);
}

// ---------- game flow ----------
function addScore(n) {
  score += n;
  if (score > hi) { hi = score; }
  updateHud();
}
function updateHud() {
  $('score').textContent = score;
  $('hi').textContent = hi;
  $('lives').textContent = '●'.repeat(Math.max(0, lives));
}
function setState(s) {
  state = s; stateT = 0;
  const m = $('msg');
  m.innerHTML = {ready: `READY!<small>${LV.icon} שלב ${levelIdx + 1}: ${LV.name}</small>`, win: 'LEVEL CLEAR!'}[s] || '';
  if (s === 'over' || s === 'cleared') safeSet('chomper-hi', hi);
  const panel = s === 'title' || s === 'over' || s === 'cleared';
  $('panel').hidden = !panel;
  if (panel) showPanel(s);
}
function newLevel() {
  pellets = MAP.map(r => [...r].map(c => (c === '.' || c === 'o') ? c : ' '));
  pelletsLeft = pellets.flat().filter(c => c !== ' ').length;
  resetActors(); modeT = 0; frightT = 0;
  setState('ready');
}
function newGame(i) {
  if (LB_ON && !playerName) return;
  score = 0; lives = 3;
  loadLevel(i); updateHud(); newLevel();
}
function startIfNeeded() {
  if (state === 'title') newGame(Math.min(progress(), LEVELS.length - 1));
  else if (state === 'over') newGame(levelIdx);
  else if (state === 'cleared' && levelIdx < LEVELS.length - 1) newGame(levelIdx + 1);
}

function update(dt) {
  stateT += dt;
  if (state === 'ready') { if (stateT > 2) setState('play'); return; }
  if (state === 'dying') {
    if (stateT > 1.4) {
      lives--; updateHud(); safeSet('chomper-hi', hi);
      if (lives <= 0) setState('over'); else { resetActors(); frightT = 0; setState('ready'); }
    }
    return;
  }
  if (state === 'win') {
    if (stateT > 1.5) {
      if (progress() < levelIdx + 1) safeSet('pac-progress', levelIdx + 1);
      setState('cleared');
    }
    return;
  }
  if (state !== 'play') return;

  modeT += dt;
  if (frightT > 0) {
    frightT -= dt;
    if (frightT <= 0) for (const g of ghosts) g.fright = false;
  }
  updatePac(dt);
  for (const g of ghosts) updateGhost(g, dt);

  if (pelletsLeft <= 0) { setState('win'); return; }
  for (const g of ghosts) {
    if (g.eyes) continue;
    const dx = g.x - pac.x, dy = g.y - pac.y;
    if (dx * dx + dy * dy < 0.45) {
      if (g.fright) {
        g.eyes = true; g.fright = false;
        addScore(200 * LV.mult * Math.pow(2, Math.min(combo++, 3)));
      } else {
        setState('dying');
        try { navigator.vibrate && navigator.vibrate(150); } catch (e) {}
        return;
      }
    }
  }
}

// ---------- leaderboard (Firebase Realtime Database + Auth over REST) ----------
const LB = {
  db: 'https://packman-2cb6c-default-rtdb.europe-west1.firebasedatabase.app',

  authBase: 'https://identitytoolkit.googleapis.com',

const LB_ON = !!(LB.db && LB.apiKey);
const NAME_RE = /^[\p{L}\p{N} _-]{2,12}$/u;
const PLAYER = 'pac-auth', ADMIN = 'pac-admin';
let playerName = safeGet('pac-name') || '';
// A name saved by an older version was never registered on the server: offer it again.
const legacyName = LB_ON && !safeGet(PLAYER) ? playerName : '';
if (legacyName) playerName = '';

// Sessions: players sign in anonymously, the admin with email and password.
function loadSession(key) { try { return JSON.parse(safeGet(key) || 'null'); } catch (e) { return null; } }
function saveSession(key, uid, idToken, refreshToken, expiresIn) {
  const s = {uid, idToken, refreshToken, exp: Date.now() + (expiresIn - 60) * 1000};
  safeSet(key, JSON.stringify(s));
  return s;
}
async function postJson(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || 'HTTP ' + r.status);
  return j;
}
async function session(key) {
  let s = loadSession(key);
  if (!s && key === PLAYER) {
    const j = await postJson(`${LB.authBase}/v1/accounts:signUp?key=${LB.apiKey}`, {returnSecureToken: true});
    s = saveSession(key, j.localId, j.idToken, j.refreshToken, +j.expiresIn);
  }
  if (s && Date.now() > s.exp) {
    const r = await fetch(`${LB.tokenBase}/v1/token?key=${LB.apiKey}`, {
      method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.refreshToken)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 400) safeSet(key, '');  // account deleted or revoked
      throw new Error('refresh failed');
    }
    s = saveSession(key, j.user_id, j.id_token, j.refresh_token, +j.expires_in);
  }
  return s;
}
async function db(method, path, body, s, params = {}) {
  const q = new URLSearchParams(params);
  if (s) q.set('auth', s.idToken);
  if (LB.ns) q.set('ns', LB.ns);
  const r = await fetch(`${LB.db}/${path}.json?${q}`, body === undefined ? {method}
    : {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), {status: r.status});
  return r.json();
}

// Names are unique and permanent: players/{uid}/name and names/{lowercase name} are written together, once.
async function registerName(name) {
  const s = await session(PLAYER);
  const mine = await db('GET', `players/${s.uid}/name`);
  if (!mine) {
    const key = name.toLowerCase();
    const owner = await db('GET', 'names/' + encodeURIComponent(key));
    if (owner && owner !== s.uid) throw new Error('taken');
    try {
      await db('PATCH', '', {[`players/${s.uid}/name`]: name, [`names/${key}`]: s.uid}, s);
    } catch (e) {
      if (e.status === 401 || e.status === 403) throw new Error('taken');
      throw e;
    }
  }
  playerName = mine || name;
  safeSet('pac-name', playerName);
}
function syncName() {
  if (!LB_ON || !loadSession(PLAYER)) return;
  const apply = name => {
    if (name === playerName) return;
    playerName = name; safeSet('pac-name', name);
    if (state === 'title' || state === 'over') showPanel(state);
  };
  session(PLAYER).then(s => db('GET', `players/${s.uid}/name`)).then(n => apply(n || ''))
    .catch(() => { if (!loadSession(PLAYER)) apply(''); });
}
async function submitScore() {
  if (!LB_ON || !playerName || score <= 0) return;
  const s = await session(PLAYER);
  const best = await db('GET', `scores/${s.uid}/score`);
  if (best >= score) return;
  await db('PUT', `scores/${s.uid}`, {name: playerName, score}, s);
}
async function fetchTop(limit) {
  const data = await db('GET', 'scores', undefined, null, {orderBy: '"score"', limitToLast: limit});
  return Object.entries(data || {})
    .map(([id, v]) => ({id, name: String(v.name), score: +v.score}))
    .sort((a, b) => b.score - a.score);
}
const isAdmin = () => !!loadSession(ADMIN);
async function adminLogin(email, password) {
  const j = await postJson(`${LB.authBase}/v1/accounts:signInWithPassword?key=${LB.apiKey}`,
    {email, password, returnSecureToken: true});
  saveSession(ADMIN, j.localId, j.idToken, j.refreshToken, +j.expiresIn);
}
async function adminDelete(id) {
  await db('DELETE', `scores/${id}`, undefined, await session(ADMIN));
}

const el = (tag, props) => Object.assign(document.createElement(tag), props);
function loadBoard() {
  const b = $('board');
  if (!b) return;
  const admin = isAdmin(), me = (loadSession(PLAYER) || {}).uid;
  b.innerHTML = '<h2>🏆 טבלת שיאים</h2>';
  const body = b.appendChild(el('div', {className: 'muted', textContent: 'טוען...'}));
  fetchTop(admin ? 100 : 10).then(rows => {
    if (!rows.length) { body.textContent = 'עוד אין שיאים. תהיה הראשון!'; return; }
    const ol = el('ol');
    rows.forEach((row, i) => {
      const li = ol.appendChild(el('li', {className: row.id === me ? 'me' : ''}));
      li.append(el('span', {className: 'r', textContent: i + 1}),
                el('span', {className: 'n', textContent: row.name}),
                el('span', {textContent: row.score}));
      if (admin) li.append(el('button', {className: 'del', textContent: '🗑', title: 'מחק', onclick: () => {
        if (!confirm(`למחוק את התוצאה של ${row.name}?`)) return;
        adminDelete(row.id).then(loadBoard).catch(e => alert('המחיקה נכשלה: ' + e.message));
      }}));
    });
    body.replaceWith(ol);
  }).catch(() => { body.textContent = 'אין חיבור לטבלת השיאים'; });
}
function nameForm() {
  const f = el('form', {className: 'nameform', innerHTML:
    '<div class="row"><input id="nameIn" maxlength="12" placeholder="בחר שם" autocomplete="off"><button>שמור</button></div>' +
    '<div class="hint">כדי לשחק צריך לבחור שם. אי אפשר לשנות אותו אחר כך.</div><div class="err" id="nameErr"></div>'});
  f.querySelector('input').value = legacyName;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = $('nameIn').value.trim().replace(/\s+/g, ' '), err = $('nameErr'), btn = f.querySelector('button');
    if (!NAME_RE.test(v)) { err.textContent = 'שם של 2-12 אותיות או מספרים'; return; }
    btn.disabled = true; err.textContent = 'שומר...';
    registerName(v).then(() => showPanel(state)).catch(ex => {
      btn.disabled = false;
      err.textContent = ex.message === 'taken' ? 'השם הזה תפוס, נסה שם אחר' : 'אין חיבור לאינטרנט, נסה שוב';
    });
  });
  return f;
}
// The admin enters a PIN; the matching Firebase account's password is derived from it, so the PIN never sits in the code.
const ADMIN_EMAIL = 'admin@dpackman.app';
function showAdminLogin() {
  const p = $('panel');
  p.innerHTML = '';
  p.append(el('h1', {textContent: '🛡️ מצב מנהל'}));
  const f = p.appendChild(el('form', {className: 'nameform', innerHTML:
    '<input id="admPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" dir="ltr">' +
    '<button>כניסה</button><div class="err" id="admErr"></div>'}));
  f.addEventListener('submit', e => {
    e.preventDefault();
    $('admErr').textContent = 'בודק...';
    adminLogin(ADMIN_EMAIL, 'pacman-' + $('admPin').value).then(() => showPanel(state)).catch(err => {
      $('admErr').textContent = /TOO_MANY/.test(err.message) ? 'יותר מדי ניסיונות, נסה שוב מאוחר יותר' : 'סיסמה שגויה';
    });
  });
  p.append(el('button', {className: 'link', textContent: 'ביטול', onclick: () => showPanel(state)}));
  $('admPin').focus();
}
function showHelp() {
  const p = $('panel');
  p.innerHTML = '';
  p.append(el('h1', {textContent: 'איך משחקים'}),
    el('div', {className: 'help', innerHTML: 'אוכלים את כל הנקודות ובורחים מהרוחות.<br>' +
      'כדור גדול הופך את הרוחות לכחולות, ואז אפשר לאכול אותן.<br>' +
      'מסיימים שלב, ונפתח השלב הבא בלובי. כל שלב קשה יותר ושווה יותר נקודות.<br>' +
      'שליטה: ג׳ויסטיק, החלקה על המסך או החצים במקלדת.'}),
    el('button', {textContent: 'חזרה', onclick: () => showPanel(state)}));
}
function menu() {
  const wrap = el('div', {className: 'menu'});
  const list = el('div', {className: 'menu-list', hidden: true});
  wrap.append(el('button', {className: 'burger', textContent: '☰', title: 'תפריט', onclick: () => { list.hidden = !list.hidden; }}), list);
  const item = (text, fn) => list.append(el('button', {textContent: text, onclick: () => { list.hidden = true; fn(); }}));
  if (LB_ON) {
    if (isAdmin()) item('🚪 יציאה ממצב מנהל', () => { safeSet(ADMIN, ''); showPanel(state); });
    else item('🛡️ מצב מנהל', showAdminLogin);
  }
  item('❓ איך משחקים', showHelp);
  return wrap;
}
function levelGrid(enabled) {
  const g = el('div', {className: 'levels'}), done = progress();
  LEVELS.forEach((lv, i) => {
    const locked = i > Math.min(done, LEVELS.length - 1);
    const b = g.appendChild(el('button', {className: 'lvl', disabled: !enabled || locked, onclick: () => newGame(i)}));
    b.style.setProperty('--c', lv.color);
    b.append(el('b', {textContent: locked ? '🔒' : i + 1}), el('span', {textContent: lv.name}));
    if (i < done) b.append(el('i', {textContent: '⭐'}));
  });
  return g;
}
function showPanel(kind) {
  const p = $('panel');
  p.innerHTML = '';
  p.append(menu());
  const last = levelIdx === LEVELS.length - 1;
  p.append(el('h1', {textContent: {title: 'פאקמן', over: 'GAME OVER',
    cleared: last ? 'ניצחת את כל השלבים! 🏆' : `שלב ${levelIdx + 1} הושלם! 🎉`}[kind]}));
  if (kind !== 'title') p.append(el('div', {className: 'final', innerHTML: `${LV.icon} ${LV.name} · ניקוד: <b>${score}</b>`}));
  if (LB_ON) {
    p.append(playerName ? el('div', {className: 'who', textContent: `משחק בתור: ${playerName}`}) : nameForm());
    if (isAdmin()) p.append(el('div', {className: 'admin', textContent: '🛡️ מצב מנהל: אפשר למחוק תוצאות'}));
  }
  const ready = !LB_ON || !!playerName;
  if (kind === 'title') {
    p.append(levelGrid(ready));
  } else {
    const row = p.appendChild(el('div', {className: 'actions'}));
    if (kind === 'over') row.append(el('button', {id: 'go', textContent: 'נסה שוב', disabled: !ready, onclick: () => newGame(levelIdx)}));
    if (kind === 'cleared' && !last) row.append(el('button', {id: 'go', textContent: 'לשלב הבא ▶', disabled: !ready, onclick: () => newGame(levelIdx + 1)}));
    row.append(el('button', {className: 'secondary', textContent: 'ללובי', onclick: () => setState('title')}));
  }
  if (!LB_ON) return;
  p.append(el('div', {id: 'board'}));
  if (kind === 'title') loadBoard();
  else submitScore().catch(() => {}).then(loadBoard);
}

// ---------- rendering ----------
function buildWalls(dpr) {
  wallLayer = document.createElement('canvas');
  wallLayer.width = cv.width; wallLayer.height = cv.height;
  const g = wallLayer.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.strokeStyle = LV.color; g.lineWidth = Math.max(2, cell / 8); g.lineCap = 'round';
  g.shadowColor = LV.color; g.shadowBlur = cell / 3;
  const isW = (x, y) => x >= 0 && x < W && y >= 0 && y < H && MAP[y][x] === '#';
  g.beginPath();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!isW(x, y)) continue;
    const x0 = x * cell, y0 = y * cell, x1 = x0 + cell, y1 = y0 + cell;
    if (!isW(x, y - 1)) { g.moveTo(x0, y0); g.lineTo(x1, y0); }
    if (!isW(x, y + 1)) { g.moveTo(x0, y1); g.lineTo(x1, y1); }
    if (!isW(x - 1, y)) { g.moveTo(x0, y0); g.lineTo(x0, y1); }
    if (!isW(x + 1, y)) { g.moveTo(x1, y0); g.lineTo(x1, y1); }
  }
  g.stroke();
  g.shadowBlur = 0; g.strokeStyle = '#ff8de0'; g.lineWidth = Math.max(2, cell / 6);
  g.beginPath(); g.moveTo(9 * cell, 8.5 * cell); g.lineTo(10 * cell, 8.5 * cell); g.stroke();
}
function fit() {
  const aw = innerWidth, ah = innerHeight - $('hud').offsetHeight - $('joy').offsetHeight - 32;
  cell = Math.max(8, Math.floor(Math.min(aw / W, ah / H)));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * cell + 'px'; cv.style.height = H * cell + 'px';
  cv.width = Math.round(W * cell * dpr); cv.height = Math.round(H * cell * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  $('hud').style.width = W * cell + 'px';
  $('msg').style.fontSize = Math.max(16, cell * 1.2) + 'px';
  buildWalls(dpr);
}
const faceAngle = f => f === R ? 0 : f === D ? Math.PI / 2 : f === L ? Math.PI : -Math.PI / 2;

function drawPac() {
  const cx = (pac.x + .5) * cell, cy = (pac.y + .5) * cell, r = cell * .46;
  const a = faceAngle(pac.face);
  const mouth = state === 'dying'
    ? Math.min(1, stateT / 1.2) * Math.PI
    : (Math.abs(Math.sin(pac.anim)) * .25 + .02) * Math.PI;
  ctx.fillStyle = '#ffdd00';
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, a + mouth, a + 2 * Math.PI - mouth);
  ctx.closePath(); ctx.fill();
}
function drawGhost(g, t) {
  const cx = (g.x + .5) * cell, cy = (g.y + .5) * cell, r = cell * .46;
  const f = g.dir || L;
  if (!g.eyes) {
    const flash = g.fright && frightT < 2 && Math.floor(t * 6) % 2;
    ctx.fillStyle = g.fright ? (flash ? '#fff' : '#2233ff') : g.color;
    ctx.beginPath();
    ctx.arc(cx, cy - r * .1, r, Math.PI, 0);
    ctx.lineTo(cx + r, cy + r * .9);
    const ph = Math.floor(t * 6) % 2;
    for (let i = 1; i <= 6; i++) ctx.lineTo(cx + r - i * (r / 3), cy + r * (((i + ph) % 2) ? .9 : .6));
    ctx.closePath(); ctx.fill();
  }
  if (g.fright && !g.eyes) {
    ctx.fillStyle = '#ffd0d0';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * r * .35, cy - r * .2, r * .13, 0, 7); ctx.fill(); }
  } else {
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + s * r * .38, cy - r * .2, r * .3, 0, 7); ctx.fill();
      ctx.fillStyle = '#1a2cff'; ctx.beginPath();
      ctx.arc(cx + s * r * .38 + f.x * r * .13, cy - r * .2 + f.y * r * .13, r * .14, 0, 7); ctx.fill();
    }
  }
}
function draw(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W * cell, H * cell);
  ctx.drawImage(wallLayer, 0, 0, W * cell, H * cell);
  if (pellets) {
    ctx.fillStyle = '#ffd9a8';
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = pellets[y][x];
      if (c === '.') { ctx.beginPath(); ctx.arc((x + .5) * cell, (y + .5) * cell, cell * .1, 0, 7); ctx.fill(); }
      else if (c === 'o' && Math.floor(t * 4) % 2) { ctx.beginPath(); ctx.arc((x + .5) * cell, (y + .5) * cell, cell * .3, 0, 7); ctx.fill(); }
    }
  }
  if (!pac) return;
  if (state !== 'dying') for (const g of ghosts) drawGhost(g, t);
  drawPac();
  if (LV.dark && state !== 'title') {
    const cx = (pac.x + .5) * cell, cy = (pac.y + .5) * cell;
    const g = ctx.createRadialGradient(cx, cy, cell * 2.5, cx, cy, cell * 5.5);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.96)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W * cell, H * cell);
  }
}

// ---------- input ----------
function setWant(d) { if (pac) pac.want = d; }
const KEYS = {ArrowUp: U, KeyW: U, ArrowDown: D, KeyS: D, ArrowLeft: L, KeyA: L, ArrowRight: R, KeyD: R};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  if (KEYS[e.code]) { e.preventDefault(); setWant(KEYS[e.code]); }
  else if (e.code === 'Enter' || e.code === 'Space') startIfNeeded();
});
const joy = $('joy'), knob = $('knob');
let joyId = null, joyDir = null;
function joyMove(e) {
  const r = joy.getBoundingClientRect(), max = r.width / 2 - 22;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > max) { dx *= max / len; dy *= max / len; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  if (len < max * 0.35) return;
  const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? R : L) : (dy > 0 ? D : U);
  if (d !== joyDir) { joyDir = d; setWant(d); try { navigator.vibrate && navigator.vibrate(8); } catch (err) {} }
}
joy.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joy.classList.add('active'); joyMove(e);
});
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => {
  if (e.pointerId !== joyId) return;
  joyId = null; joyDir = null; joy.classList.remove('active'); knob.style.transform = '';
};
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);
let sx = 0, sy = 0, down = false;
addEventListener('pointerdown', e => { down = true; sx = e.clientX; sy = e.clientY; });
addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  setWant(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? R : L) : (dy > 0 ? D : U));
  sx = e.clientX; sy = e.clientY;
});
addEventListener('pointerup', () => { down = false; });
addEventListener('pointercancel', () => { down = false; });
addEventListener('resize', fit);
addEventListener('orientationchange', fit);

// ---------- main loop ----------
let last = 0;
function frame(ts) {
  const t = ts / 1000, dt = Math.min(0.05, t - last || 0); last = t;
  update(dt); draw(t);
  requestAnimationFrame(frame);
}
resetActors();
updateHud(); fit(); setState('title'); syncName();
requestAnimationFrame(frame);
window.__chomper = {get state() { return state; }, get score() { return score; }, newGame, setWant, U, D, L, R};

if ('serviceWorker' in navigator) {
  if (window.Capacitor) {
    // Inside the Android app the files are local, so an offline cache only gets in the way of updates.
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  } else if (/^https?:$/.test(location.protocol)) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
}
})();
</script>
