name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check Firebase setup (leaves no data behind)
        run: |
          db=$(grep -oP "^  db: '\K[^']*" index.html)
          key=$(grep -oP "^  apiKey: '\K[^']*" index.html)
          if [ -n "$db" ] && [ -n "$key" ]; then
            rel=$(curl -s -o /dev/null -w '%{http_code}' "$db/released.json?shallow=true")
            if [ "$rel" = "200" ]; then
              echo "::notice title=Rules check::the latest database rules are published"
            else
              echo "::warning title=Rules check::the latest database rules are NOT published (HTTP $rel), paste database.rules.json into the Firebase console"
            fi
            res=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"returnSecureToken":true}' "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$key")
            tok=$(echo "$res" | jq -r '.idToken // empty')
            if [ -n "$tok" ]; then
              curl -s -X POST -H 'Content-Type: application/json' -d "{\"idToken\":\"$tok\"}" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$key" > /dev/null
              echo "::notice title=Auth check::anonymous sign-in works"
            else
              echo "::warning title=Auth check::anonymous sign-in failed: $(echo "$res" | jq -c '.error.message')"
            fi
          fi
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Use the fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf "%s" "$KEYSTORE_B64" | tr -d " \r\n" | base64 -d > "$RUNNER_TEMP/dpackman.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dpackman.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning title=Signing::ANDROID_KEYSTORE_B64 secret is missing, so this APK will not install over the previous one"
          fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Check the APK is signed with the fixed key
        run: |
          expected=a4586feb3c1ee3eef703d82f05f0ee7d1d48d4b3d8d72c572a5d834fe586bcfc
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cert=$("$bt/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 SHA-256)
          if echo "$cert" | grep -q "$expected"; then
            echo "::notice title=Signing::signed with the fixed key ($expected)"
          else
            echo "::error title=Signing::wrong key, not publishing this APK. $cert"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chomper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk chomper.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest chomper.apk --title "Chomper - latest build" --notes "Download chomper.apk on your Android phone and install it."
