name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check leaderboard database (read only)
        run: |
          url=$(grep -oP "^const LB_URL = '\K[^']*" index.html)
          if [ -n "$url" ]; then
            res=$(curl -sS -w ' (HTTP %{http_code})' "$url/scores.json?orderBy=%22score%22&limitToLast=10")
            echo "::notice title=Leaderboard check::$res"
          fi
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chomper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk chomper.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest chomper.apk --title "Chomper - latest build" --notes "Download chomper.apk on your Android phone and install it."
